# Model catalog for /v1/models/recommend. Copy it, edit it and point
# ROUTER_MODEL_CATALOG at your copy to replace this one.
#
# Facts (checked 2026-09-23): API ids, USD prices per 1M tokens (input/output),
# context windows and local download sizes come from the official pages:
#   Anthropic  https://docs.anthropic.com (models and pricing)
#   OpenAI     https://developers.openai.com/api/docs/pricing
#   Google     https://ai.google.dev/gemini-api/docs/pricing
#   Ollama     https://ollama.com/library
#
# Cost is derived from the price (3 input : 1 output tokens); local models cost 0.
# A cloud model without a price needs `cost:` 0-5 instead.
#
# Skills (0-10 per task, 0 = not supported) and speed (1-5) are ESTIMATES for
# relative ranking, not benchmark results. How to read the skill scale, which the
# router compares with 4 (simple), 6 (moderate) and 8 (complex) requests:
#   4-5  fine for short, everyday requests
#   6-7  reliable on moderate, multi-step work
#   8    strong on complex work
#   9-10 frontier level
# Local speeds assume a laptop CPU without a GPU, where even small models answer
# slower than fast cloud models; raise them if you run Ollama on a GPU.
updated: "2026-09-25"

groups:
  - id: claude
    label: Claude
    provider: Anthropic
  - id: chatgpt
    label: ChatGPT / OpenAI
    provider: OpenAI
  - id: gemini
    label: Gemini
    provider: Google
  - id: local
    label: Local (Ollama)
    provider: Ollama

