# Model catalog for /v1/models/recommend. Copy it, edit it and point
# ROUTER_MODEL_CATALOG at your copy to replace this one.
#
# Facts (checked 2026-09-23): API ids, USD prices per 1M tokens (input/output),
# context windows and local download sizes come from the official pages:
#   Anthropic  https://docs.anthropic.com (models and pricing)
#   OpenAI     https://developers.openai.com/api/docs/pricing
#   Google     https://ai.google.dev/gemini-api/docs/pricing
#   Ollama     https://ollama.com/library
# Skills (0-10 per task, 0 = not supported), cost (0-5) and speed (1-5) are
# ESTIMATES meant for relative ranking, not benchmark results. Local speed
# depends on your hardware. Edit them to match your experience.
updated: "2026-09-23"

groups:
  - id: claude
    label: Claude
    provider: Anthropic
