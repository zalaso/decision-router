name: tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pip install 'git+https://github.com/GPT-AGI/OpenJev.git@0e7bb990211df139da13dc67aa2a7aceca311af7'
      - run: python -m pytest -q
      - run: python -m mypy
      - run: python -m ruff check src tests benchmarks scripts
      - run: python -m ruff format --check src tests benchmarks scripts
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -c "import decision_router; print(decision_router.__file__)"
      - run: decision-router --config config/example.yaml route 'Write Python code' > /dev/null
