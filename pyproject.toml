[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "decision-router"
version = "0.1.0"
description = "Provider-independent typed decisions and deterministic routing policy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "PyYAML>=6.0.2,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "mypy>=1.15,<2", "ruff>=0.11,<1", "types-PyYAML>=6"]
local = ["torch>=2.6,<3", "transformers>=4.48,<5", "sentencepiece>=0.2,<1", "protobuf>=5,<7"]

[project.scripts]
decision-router = "decision_router.cli:main"

[project.urls]
Repository = "https://github.com/zalaso/decision-router"
Issues = "https://github.com/zalaso/decision-router/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_router"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["transformers.*", "torch.*", "openjev.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
